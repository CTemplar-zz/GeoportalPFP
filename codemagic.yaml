workflows:
  ios-app-store:
    name: Geoportal PFP - iPhone App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.howwe.geoportal
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Build web resources and sync iOS
        script: |
          set -e
          npm run icons
          npm run sync
          npm run verify:ios
      - name: Resolve Swift packages
        script: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Apply distribution signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Manual runs only. No automatic upload or App Store review submission.
    # Configure Apple Distribution certificate + matching App Store profile
    # in Codemagic's Code signing identities before running this workflow.
