workflows:
  ios-screenshots:
    name: Geoportal PFP - Capturas iPhone 6.5
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Build web resources and sync iOS
        script: |
          set -e
          npm run icons
          npm run sync
          npm run verify:ios
      - name: Capture native iPhone screens with XCUITest
        script: |
          set -euo pipefail
          mkdir -p build/ios/screenshots
          node scripts/capture-ios.mjs 2>&1 | tee build/ios/screenshots/capture.log
    artifacts:
      - build/ios/screenshots/Geoportal-PFP-Capturas-iPhone-65.zip
      - build/ios/screenshots/iPhone-65-1284x2778/*.png
      - build/ios/screenshots/iPhone-65-1284x2778/resoluciones.json
      - build/ios/screenshots/attachments/**
      - build/ios/screenshots/capture.log
      - build/ios/screenshots/native-startup.log
      - build/ios/screenshots/device.json
    # Manual execution, no App Preview subscription and no store submission.
  ios-simulator:
    name: Geoportal PFP - iPhone Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Build web resources and sync iOS
        script: |
          set -e
          npm run icons
          npm run sync
          npm run verify:ios
      - name: Build iPhone simulator app
        script: |
          set -euo pipefail
          mkdir -p build/ios/simulator
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/ios/simulator/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ios/simulator/xcodebuild.log
      - name: Package simulator app
        script: |
          set -e
          SIM_APP="build/ios/simulator/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$SIM_APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$SIM_APP/Info.plist" | grep -qx iPhoneSimulator
          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" build/ios/simulator/Geoportal-PFP-iPhone-Simulator.zip
    artifacts:
      - build/ios/simulator/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - build/ios/simulator/Geoportal-PFP-iPhone-Simulator.zip
      - build/ios/simulator/xcodebuild.log
    # Simulator only: no distribution credentials, store upload or paid App Preview.
  ios-app-store:
    name: Geoportal PFP - iPhone e iPad App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic iOS Build
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.howwe.geoportal
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Build web resources and sync iOS
        script: |
          set -e
          npm run icons
          npm run sync
          npm run verify:ios
      - name: Resolve Swift packages
        script: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Apply distribution signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
    # Manual runs: upload build to Apple, never submit a review automatically.
    # Configure Apple Distribution certificate + matching App Store profile
    # in Codemagic's Code signing identities before running this workflow.
